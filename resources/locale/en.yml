fof-gamification:
  forum:
    index_sort:
      trending_button: Trending
      votes_button: Upvotes
    votes: Votes
    vote_title: Show Who Voted
    nav:
      name: Rankings
    ranking:
      rank: Place
      name: User
      amount: Points
    leaderboard:
      metric_label: Rank by
      period_label: Over
      empty: Nobody has made the leaderboard yet.
      relative_label: Score relative to the leader
      you: You
      # Read inside a sentence, so lower case and no leading capital. The
      # comparison phrase names the window each award is measured against,
      # which is not always the same wording as the window itself.
      period_phrase:
        day: today
        week: this week
        month: this month
        year: this year
        all: all time
      period_previous:
        day: yesterday
        week: last week
        month: last month
        year: last year
        all: all time
      highlight:
        climber: Biggest climber
        climber_help: Climbed the most places since {previous}
        consistent: Most consistent
        consistent_help: Active on the most separate days {period}
        newcomer: New face
        newcomer_help: Highest placed of the people who were not here {previous}
        days: "{count, plural, one {# day} other {# days}}"
      find_me: "Find me ({position})"
      find_me_failed: The board changed while looking for your place. Try again.
      moved_new: New
      moved_new_tooltip: New to the leaderboard
      moved_up: "Up {count, plural, one {# place} other {# places}}"
      moved_down: "Down {count, plural, one {# place} other {# places}}"
      to_next: "{count, plural, one {# to go} other {# to go}} to climb a place"
      metric:
        # Both vote metrics count votes *received* on the member's own posts,
        # never votes they cast. The distinction between them is the
        # arithmetic, so the names have to carry it: otherwise the same person
        # shows two very different numbers with nothing to explain why.
        votes: Score (upvotes minus downvotes)
        upvotes: Upvotes received
        posts: Posts written
        discussions: Discussions started
      # Calendar periods: "this month" is the month we are in, not the last
      # thirty days.
      period:
        day: Today
        week: This week
        month: This month
        year: This year
        all: All time
      ordinal:
        one: "{count}st"
        two: "{count}nd"
        few: "{count}rd"
        other: "{count}th"
        zero: "{count}th"
        many: "{count}th"
    notification:
      upvote: "{username} upvoted your post"
      downvote: "{username} downvoted your post"
      prefrences:
        vote: When one of my posts is up/down voted
    user:
      card:
        points: "{count, plural, one { {count} point} other {{count} points}}"
      rank: "{rank}"
      votes_link: Votes
    modal:
      downvotes_label: 'Downvoters:'
      title: Voters
      upvotes_label: 'Upvoters:'
    mod_item: View Voters
    voters:
      none: No voters yet
      label: Voters
      label_none: No voters
    post:
      upvote_button: Upvote post
      downvote_button: Downvote post

  admin:
    permissions:
      vote_label: Upvote/Downvote posts
      see_votes_label: See up/down vote count
      see_voters_label: See who voted
      see_ranking_page: See ranking page
      upvote_notifications: Receive notifications on upvote
      downvote_notifications: Receive notifications on downvote
    page:
      rankings:
        blocked:
          placeholder: admin, user1, user2
          title: Ignored Users
          help: These users will not be shown on the ranking page. Usernames should be separated by a comma followed by a space.
        default_metric:
          title: Default ranking
          help: The ranking the leaderboard opens on. Members can still switch to any of the others.
        default_period:
          title: Default period
          help: The window the leaderboard opens on. All time is a hall of fame; a shorter period gives everyone a race they can still win.
        excluded_users:
          title: Excluded users
          help: These users will not appear on the leaderboard.
          select: Choose users
          remove: Remove
        excluded_groups:
          title: Excluded groups
          help: Members of these groups will not appear on the leaderboard.
        exclude_suspended: Hide suspended users
        exclude_suspended_help: While a user is suspended they are left off the leaderboard. They reappear when the suspension ends.
        title: Rankings Page
        enable: Enable custom images
        custom_image_1: 1st place image
        custom_image_2: 2nd place image
        custom_image_3: 3rd place image
      alt_votes:
        icon_name: Alt layout icon name
      votes:
        enabled_tags: Tags with voting enabled
        enabled_tags_help: Voting only appears in discussions carrying one of these tags. Leave empty to disable voting everywhere. This applies to everyone, including administrators — permissions still control who may vote within these tags.
        points_title: Points Placeholder
        points_placeholder: "Points: "
        color_holder: '#ffffff'
        auto_upvote: Auto upvote posts when posted
        rate_limit: Enforce a vote rate limit (10 seconds)
        discussion_page: Show total votes of original post on discussions list
        alternate_layout: Use alternate voting layout on discussions list
        alternate_post_layout: Use alternate voting layout on posts
        title: Votes
        vote_color: Voted color
        icon_name: Upvote/downvote icon
        icon_help: "Input any Font-Awesome icon that is suffixed with -up and -down. Examples: arrow, thumbs, chevron"
        icon_preview_upvote: Upvote
        icon_preview_downvote: Downvote
        upvotes_only: Only allow upvoting
        first_post_only: Only allow up/down votes in the first post in a discussion
        allow_self_votes: Users may vote on their own posts
      save_settings: Save settings
      convert:
        button: Convert likes to upvotes
        help: Convert your previous likes from flarum/likes into upvotes, as well as calculate the hotness for all current discussions.
        converting: Your likes are now being converted. Refresh your site after a few minutes to see the process finished. (Conversion time might take a while depending on your total forum likes)
        converted: "Successfully converted all {number} likes"
      ranks:
        title: Ranks
        ranks: Custom ranks
        number_title: How many rank badges should be shown?
        help:
          color: '#ffffff'
          help: "Input the required number of upvotes, the name of the rank, and the hex color of the rank"
          points: Points
          name: Name
      groups:
        title: Automatically assigned groups
        help: >
          The selected groups will be automatically added or removed as needed when the number of points of a user changes.
          If you made changes to the configuration, you should run the <code>php flarum fof:gamification:assign-groups</code> command to update existing users.
          If you wish to delete a rule and remove all users from the group, set both minimum and maximum values to an empty string, save the settings and run the command line command.
          Finally you can delete the rule entirely from the settings.
        column:
          group: Group
          minPoints: Minimum points (inclusive)
          maxPoints: Maximum points (inclusive)
        add: Add new rule
        delete: Delete rule

  email:
    body:
      postVoted: |
        Hey {recipient_display_name},

        {actor_display_name} just voted on your post in {discussion_title}.

        View it here: {discussion_url}
    subject:
      postVoted: Your post was voted on by {display_name}

lib:
    gambits:
      trending:
        key: trending
